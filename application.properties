

spring.application.name=api-gateway
server.port=9090

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true


# Department Service
spring.cloud.gateway.server.webflux.routes[0].id=department-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://DEPARTMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/departments/**
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=POST,GET


# Student Service
spring.cloud.gateway.server.webflux.routes[1].id=student-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/students/**
